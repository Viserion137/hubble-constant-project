name: Run analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.2.0

      - name: Unit tests of the fitting functions
        run: pytest -q

      - name: Run analysis.py (fits, checks, figures)
        run: python analysis.py > fresh_output.txt 2>&1

      - name: Check that the output matches analysis_output.txt
        run: diff analysis_output.txt fresh_output.txt
